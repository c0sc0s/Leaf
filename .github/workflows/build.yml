name: Desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            executable: release/mac-arm64/Leaf.app/Contents/MacOS/Leaf
          - os: windows-latest
            executable: release/win-unpacked/Leaf.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
        timeout-minutes: 20
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run dist:mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run dist:win
        if: runner.os == 'Windows'
      - run: npm run test:desktop
      - run: node tests/packaged/production.mjs
        env:
          LEAF_EXECUTABLE: ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            dist-plugins/*.leaf-plugin
          if-no-files-found: error
